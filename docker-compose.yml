version: '3'
services:
  front_app:
    build:
      context: ./frontend
    container_name: chatVRM
    tty: true
    volumes:
      - ./frontend:/workspace
    command: sh -c "npm install && npm run dev"
    networks:
      - nginx_network

  uec_qa:
    build: ./backend/qa_api
    working_dir: /qa_api
    tty: true
    ports: 
      - "12344:12344"
    volumes:
      - ./backend/qa_api:/qa_api
    command: sh -c "uvicorn main:app --reload --host 0.0.0.0 --port 12344 --proxy-headers"
    networks:
      - nginx_network
    env_file:
      - ./frontend/.env.local

  scrape_uec_info:
    build: ./backend/scrape_uec_info
    working_dir: /scrape_uec_info
    tty: true
    volumes:
      - ./backend/scrape_uec_info:/scrape_uec_info

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: voicevox
    ports:
      - "50021:50021"
    restart: unless-stopped # PC再起動後なども含め、コンテナが停止したら自動で再起動
    networks:
      - nginx_network
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/data 
      - ./config:/config
      - ./log/caddy:/var/log/caddy
    restart: unless-stopped
    networks:
      - nginx_network

networks:
  nginx_network:
    driver: bridge